name: radaxis-ris

services:
  db:
    image: postgres:16
    container_name: radaxis-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5434:5432"

    volumes:
      - radaxis_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  orthanc:
    image: orthancteam/orthanc:26.9.1
    container_name: radaxis-orthanc
    restart: unless-stopped

    ports:
      - "8044:8042"
      - "4244:4242"

    environment:
      ORTHANC__NAME: "RadAxis RIS PACS"
      ORTHANC__DICOM_AET: "RADAXIS"

      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: "{\"${ORTHANC_USERNAME}\":\"${ORTHANC_PASSWORD}\"}"

      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"

    volumes:
      - radaxis_orthanc_data:/var/lib/orthanc/db

  ohif:
    image: ohif/app:latest
    container_name: radaxis-ohif
    restart: unless-stopped

    ports:
      - "127.0.0.1:3002:80"

    environment:
      PORT: 80
      PUBLIC_URL: "/"
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}

    volumes:
      - ./docker/ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
      - ./docker/ohif/default.conf.template:/usr/src/ohif-nginx.conf.template:ro
      - ./docker/ohif/entrypoint.sh:/docker-entrypoint.d/custom-entrypoint.sh:ro

    entrypoint: ["/bin/sh", "/docker-entrypoint.d/custom-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]

    depends_on:
      - orthanc

volumes:
  radaxis_postgres_data:
  radaxis_orthanc_data:
